name: dml-v4-survey

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_HOSTS: ${MONGODB_HOSTS:-127.0.0.1:27017}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-dml_v4_survey}
      MONGODB_AUTH_SOURCE: ${MONGODB_AUTH_SOURCE:-}
      MONGODB_REPLICA_SET: ${MONGODB_REPLICA_SET:-}
      MONGODB_WRITE_CONCERN: ${MONGODB_WRITE_CONCERN:-1}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?请在 docker/.env 中设置 ADMIN_PASSWORD_HASH}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?请在 docker/.env 中设置 ADMIN_SESSION_SECRET}
      ADMIN_SECURE_COOKIE: ${ADMIN_SECURE_COOKIE:-false}
      EXTERNAL_SSO_SHARED_SECRET: ${EXTERNAL_SSO_SHARED_SECRET:-}
      EXTERNAL_SSO_ISSUER: ${EXTERNAL_SSO_ISSUER:-dml-demo-external}
      EXTERNAL_SSO_AUDIENCE: ${EXTERNAL_SSO_AUDIENCE:-dml-survey}
      EXTERNAL_PORTAL_URL: ${EXTERNAL_PORTAL_URL:-http://127.0.0.1:9000}
      USER_SESSION_SECRET: ${USER_SESSION_SECRET:-}
      USER_SECURE_COOKIE: ${USER_SECURE_COOKIE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
