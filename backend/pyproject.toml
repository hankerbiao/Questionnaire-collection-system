[project]
name = "dml-v4-survey-backend"
version = "0.1.0"
description = "DML v4 discovery survey API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "pillow>=11.3,<13",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "pymongo>=4.13,<5",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
